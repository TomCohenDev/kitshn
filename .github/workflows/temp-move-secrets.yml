name: temp move secrets to kitshn-1
# Temporary: encrypts secrets with kitshn-1's public keys (sealed box). Only GitHub can decrypt the output.
on: workflow_dispatch
permissions: {}
jobs:
  seal:
    runs-on: ubuntu-latest
    environment: host
    steps:
      - name: Seal
        env:
          ENV_KEY: "cwE5Axt7bw2ionWKISKomclAd8UKWtRGvx5Ytioxyxs="
          REPO_KEY: "+JIV2sTP1SeexItvKcp3lEnmVvvu8O/H1p37b2GZCiE="
          KITSHN_SSH_KEY: ${{ secrets.KITSHN_SSH_KEY }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          pip install --quiet pynacl
          python3 - <<'PY'
          import base64, os
          from nacl import public, encoding
          def seal(key, value):
              box = public.SealedBox(public.PublicKey(key.encode(), encoding.Base64Encoder()))
              return base64.b64encode(box.encrypt(value.encode())).decode()
          for name, key in [("KITSHN_SSH_KEY", "ENV_KEY"), ("CLOUDFLARE_DNS_API_TOKEN", "ENV_KEY"), ("TOKEN", "REPO_KEY")]:
              value = os.environ[name]
              assert value, name
              print(f"SEALED {name} {seal(os.environ[key], value)}")
          PY
