name: kitshn 2

# Checks the TypeScript code of kitshn 2. On main, it also publishes the Worker bundle as the rolling
# release "edge", which the bootstrap script downloads (K-1203).
on:
  pull_request:
    paths: [packages/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.base.json, .github/workflows/edge.yml]
  push:
    branches: [main]
    paths: [packages/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.base.json, .github/workflows/edge.yml]

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: sh -n packages/edge/public/install && sh -n packages/edge/public/join
      - run: pnpm --filter @kitshn/edge run build
      - uses: actions/upload-artifact@v7
        with:
          name: kitshn-edge
          path: packages/edge/dist/kitshn-edge.tar.gz

  release:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build the daemon for each platform (K-601)
        working-directory: packages/daemon
        run: node scripts/build.ts
      - name: Build the kitshn CLI and pack the kitshn package (K-801, K-803)
        working-directory: packages/kitshn
        run: |
          bun build src/cli.ts --target=node --outfile=dist/kitshn.mjs
          npm pack --pack-destination dist
          mv dist/kitshn-*.tgz dist/kitshn.tgz
      - uses: actions/download-artifact@v8
        with:
          name: kitshn-edge
      # A release made with GITHUB_TOKEN triggers no other workflow, so homebrew.yml stays quiet.
      # K-617: one release per commit, edge-<version>, that nothing changes later, with SHA256SUMS. The
      # Worker names its version; join, update and deploy download from that release only. The rolling
      # "edge" release stays for the bootstrap of a new account.
      - name: Publish edge-<version> and the rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_SHA:0:12}"
          mkdir assets
          cp kitshn-edge.tar.gz packages/daemon/dist/kitshn-linux-arm64 packages/daemon/dist/kitshn-linux-x64 \
            packages/daemon/dist/kitshn-darwin-arm64 packages/daemon/dist/kitshn-darwin-x64 \
            packages/kitshn/dist/kitshn.mjs packages/kitshn/dist/kitshn.tgz assets/
          (cd assets && sha256sum * > SHA256SUMS)
          gh release create "edge-$version" assets/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "kitshn 2 $version" --notes "kitshn 2 Worker bundle, daemon and CLI from $GITHUB_SHA."
          if gh release view edge >/dev/null 2>&1; then
            gh release upload edge assets/* --clobber
            gh release edit edge --target "$GITHUB_SHA" --notes "kitshn 2 Worker bundle, daemon and CLI from $GITHUB_SHA."
          else
            gh release create edge assets/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "kitshn 2 edge" --notes "kitshn 2 Worker bundle, daemon and CLI from $GITHUB_SHA."
          fi
