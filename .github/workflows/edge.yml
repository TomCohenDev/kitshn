name: kitshn 2

# Checks the TypeScript code of kitshn 2. On main, it also publishes the Worker bundle as the rolling
# release "edge", which the bootstrap script downloads (K-1203).
on:
  pull_request:
    paths: [packages/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.base.json, .bun-version, .github/workflows/edge.yml]
  push:
    branches: [main]
    paths: [packages/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.base.json, .bun-version, .github/workflows/edge.yml]

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The daemon's tests run on Bun, the runtime that it ships with (Bun.YAML, K-818).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: sh -n packages/edge/public/install && sh -n packages/edge/public/join
      # K-701: a compiled binary reads the peer user id with the daemon's code, so a Bun without `socket.fd` fails here.
      - name: Peer user id self-test, compiled for linux-x64 (K-701)
        working-directory: packages/daemon
        run: bun build src/peer.selftest.ts --compile --outfile="$RUNNER_TEMP/selftest" && "$RUNNER_TEMP/selftest"
      - run: pnpm --filter @kitshn/edge run build
      - name: The kitshn types build, and the .d.ts has no imports (K-801)
        working-directory: packages/kitshn
        run: |
          pnpm exec tsc -p tsconfig.build.json
          ! grep -q '^import' dist/index.d.ts
      - uses: actions/upload-artifact@v7
        with:
          name: kitshn-edge
          path: packages/edge/dist/kitshn-edge.tar.gz

  # K-701: the same self-test on a native arm64 runner, for the linux-arm64 daemon.
  selftest-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - name: Peer user id self-test, compiled for linux-arm64 (K-701)
        working-directory: packages/daemon
        run: bun build src/peer.selftest.ts --compile --outfile="$RUNNER_TEMP/selftest" && "$RUNNER_TEMP/selftest"

  release:
    if: github.event_name == 'push'
    needs: [check, selftest-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Build the daemon for each platform (K-601)
        working-directory: packages/daemon
        run: |
          test "$(bun --version)" = "$(cat ../../.bun-version)" || { echo "Bun $(bun --version) is not the Bun of .bun-version"; exit 1; }
          node scripts/build.ts
      - name: Build the kitshn CLI and pack the kitshn package (K-801, K-803)
        working-directory: packages/kitshn
        run: |
          pnpm run build
          pnpm pack --out dist/kitshn.tgz
      - uses: actions/download-artifact@v8
        with:
          name: kitshn-edge
      # A release made with GITHUB_TOKEN triggers no other workflow, so homebrew.yml stays quiet.
      # K-617: one release per commit, edge-<version>, that nothing changes later, with SHA256SUMS. The
      # Worker names its version; join, update and deploy download from that release only. The rolling
      # "edge" release stays for the bootstrap of a new account.
      - name: Publish edge-<version> and the rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_SHA:0:12}"
          # Not "assets/": the repo has a folder of that name.
          out="$RUNNER_TEMP/release"
          mkdir "$out"
          cp kitshn-edge.tar.gz packages/kitshn/dist/kitshn.mjs packages/kitshn/dist/kitshn.tgz "$out"/
          # Each daemon is a Bun binary with its runtime inside (85 to 105 MB); gzip takes it to about a third.
          for daemon in kitshn-linux-arm64 kitshn-linux-x64 kitshn-darwin-arm64 kitshn-darwin-x64; do
            gzip -9 -n -c "packages/daemon/dist/$daemon" > "$out/$daemon.gz"
          done
          (cd "$out" && sha256sum * > SHA256SUMS)
          # A rerun keeps the files that the first run published; a new build has other hashes.
          if ! gh release view "edge-$version" >/dev/null 2>&1; then
            gh release create "edge-$version" "$out"/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "kitshn 2 $version" --notes "kitshn 2 Worker bundle, daemon and CLI from $GITHUB_SHA."
          fi
          if gh release view edge >/dev/null 2>&1; then
            gh release upload edge "$out"/* --clobber
            gh release edit edge --target "$GITHUB_SHA" --notes "kitshn 2 Worker bundle, daemon and CLI from $GITHUB_SHA."
          else
            gh release create edge "$out"/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "kitshn 2 edge" --notes "kitshn 2 Worker bundle, daemon and CLI from $GITHUB_SHA."
          fi
          # The rolling edge release must not keep the raw daemons of older releases.
          for daemon in kitshn-linux-arm64 kitshn-linux-x64 kitshn-darwin-arm64 kitshn-darwin-x64; do
            gh release delete-asset edge "$daemon" --yes 2>/dev/null || true
          done
